name: E-Nay web checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated Pages worker
        run: |
          node web/server/build-worker.mjs
          git diff --exit-code -- web/dist/_worker.js
      - name: Core validation and recovery tests
        run: node --test web/tests/core.test.mjs web/tests/accounts.test.mjs web/tests/dashboard.test.mjs web/tests/lists.test.mjs web/tests/family-accounts.test.mjs web/tests/recovery.test.mjs
      - name: Browser test dependencies
        working-directory: web
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Browser, mobile, and offline workflows
        run: |
          node web/server/dev-server.mjs --test > /tmp/enay-web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          for attempt in range(100):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/', timeout=0.5) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(0.1)
          else:
              raise SystemExit('The browser-test preview server did not become ready.')
          PY
          node web/tests/browser.test.mjs
          node web/tests/presentation.test.mjs
          node web/tests/account-browser.test.mjs
          node web/tests/family-workflow.test.mjs
          node web/tests/vaccination-request-browser.test.mjs
          node web/tests/vaccine-picker-browser.test.mjs
          node web/tests/care-guides-browser.test.mjs
          node web/tests/usability-browser.test.mjs
          node web/tests/directory-browser.test.mjs
          node web/tests/session-browser.test.mjs
          node web/tests/language-browser.test.mjs
      - name: Cloudflare redirects and offline cache upgrades
        run: node web/tests/service-worker.test.mjs
      - name: Keep UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: test-output/web/

  family-accounts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Browser dependencies
        working-directory: web
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Personal accounts, companion access and mobile forms
        env:
          ENAY_BROWSER: ${{ matrix.engine }}
        run: |
          node web/server/dev-server.mjs --test > /tmp/enay-family-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node -e "(async()=>{for(let n=0;n<100;n++){try{if((await fetch('http://127.0.0.1:8765/api/status')).ok)return;}catch{}await new Promise(r=>setTimeout(r,100));}process.exit(1);})();"
          node web/tests/family-accounts-browser.test.mjs
          node web/tests/companions-browser.test.mjs
          node web/tests/recovery-browser.test.mjs
          node web/tests/form-requirements-browser.test.mjs
          node web/tests/growth-admin-browser.test.mjs
          node web/tests/vaccine-picker-browser.test.mjs
      - name: Keep family UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-${{ matrix.engine }}-screenshots
          path: test-output/web/
