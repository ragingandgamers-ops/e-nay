name: E-Nay checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/run_tests.py
      - name: Set up desktop display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libasound2t64
      - name: Build JavaFX desktop
        run: sh scripts/desktop.sh --build-only
      - name: Test desktop workflows
        run: xvfb-run -a python tests/run_desktop_tests.py --module-path .javafx/17.0.18/linux
